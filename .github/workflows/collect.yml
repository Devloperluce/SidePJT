# 뉴스 수집. 2시간마다 돌며 candidates/YYYY-MM-DD.json 에 후보를 누적한다.
# GitHub 예약 실행은 몇 시간씩 늦어지기도 하므로, 하루에 여러 번 모아 두면 07:00 마감 시점에는 이미 대부분이 쌓여 있다.
# - 대상: 오늘자(어제 07:00~오늘 07:00)와 내일자(오늘 07:00~) 중 아직 브리프(data/)가 없는 날짜
# - ANTHROPIC_API_KEY 시크릿이 있으면 07시 이후 첫 실행에서 오늘자 요약까지 끝낸다
name: collect

on:
  schedule:
    - cron: "17 */2 * * *" # 2시간마다 (UTC 기준 짝수 시 17분)
  workflow_dispatch:
    inputs:
      date:
        description: "특정 날짜만 수집 (YYYY-MM-DD, 비우면 자동)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 수집 (누적)
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATES="${{ inputs.date }}"
          else
            DATES="$(TZ=Asia/Seoul date +%F) $(TZ=Asia/Seoul date -d tomorrow +%F)"
          fi
          for D in $DATES; do
            if [ -f "data/$D.json" ]; then echo "$D: 브리프 있음, 건너뜀"; continue; fi
            node scripts/build-brief.js --date "$D" --candidates "candidates/$D.json" --merge || echo "$D: 수집 실패 또는 구간 시작 전"
          done

      - name: 요약·저장 (API 키가 있고 오늘자 마감이 지났을 때)
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          if [ ! -f "data/$D.json" ] && [ "$(TZ=Asia/Seoul date +%H)" -ge 7 ]; then
            node scripts/build-brief.js --date "$D"
          fi

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/ data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "collect: $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
