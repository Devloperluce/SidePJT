# 매일 07:03(KST) 뉴스 수집. GitHub 서버에서 RSS를 받아 candidates/YYYY-MM-DD.json으로 커밋한다.
# - ANTHROPIC_API_KEY 시크릿이 있으면 요약까지 끝내 data/에 바로 저장한다.
# - 없으면 후보만 커밋하고, Claude 예약 작업(07:37)이 후보를 읽어 요약·저장한다.
name: collect

on:
  schedule:
    - cron: "3 22 * * *" # UTC 22:03 = KST 07:03 (07:00 마감 직후)
  workflow_dispatch:
    inputs:
      date:
        description: "브리프 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 날짜 결정
        run: |
          D="${{ inputs.date }}"
          [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F)
          echo "BRIEF_DATE=$D" >> "$GITHUB_ENV"

      - name: 수집 (후보 저장)
        run: node scripts/build-brief.js --date "$BRIEF_DATE" --candidates "candidates/$BRIEF_DATE.json"

      - name: 요약·저장 (API 키가 있을 때만)
        if: env.ANTHROPIC_API_KEY != ''
        run: node scripts/build-brief.js --date "$BRIEF_DATE"

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/ data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "collect: $BRIEF_DATE"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
