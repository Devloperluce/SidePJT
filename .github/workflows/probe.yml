name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          for D in 2026-11-23 2026-11-24; do node scripts/build-brief.js --date $D --candidates candidates/$D.json --merge 2>&1 | tee -a probe-log.txt; done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f candidates probe-log.txt && git commit -m "probe result" && git push origin probe
